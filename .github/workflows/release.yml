name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            command: npm run dist:linux
          - os: windows-2022
            platform: windows
            arch: x64
            command: npm run dist:windows
          - os: macos-15-intel
            platform: macos
            arch: x64
            command: npm run dist:mac -- --x64
          - os: macos-15
            platform: macos
            arch: arm64
            command: npm run dist:mac -- --arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate version tag
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw Error('Invalid package version.');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`)
            throw Error('The release tag must match package.json: v' + version);
          JS
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run release:checksums
      - name: Upload installers and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Verify assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          for file in \
            "Gemini-Audio-${VERSION}-linux-x86_64.AppImage" \
            "Gemini-Audio-${VERSION}-windows-x64.exe" \
            "Gemini-Audio-${VERSION}-macos-x64.dmg" \
            "Gemini-Audio-${VERSION}-macos-arm64.dmg"; do
            test -s "installers/$file"
            (cd installers && sha256sum --check "$file.sha256")
          done
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          fi
          if DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$DRAFT" != true ]; then
              echo "Release $TAG is already published. Increase package.json version for a new release."
              exit 1
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Gemini Audio $VERSION" --notes-file .github/RELEASE_NOTES.md --generate-notes
          fi
          gh release upload "$TAG" installers/* --clobber
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
